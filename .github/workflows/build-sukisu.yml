           	/*
           	 * If the policy enables the nnp_nosuid_transition policy capability,
           	 * then we permit transitions under NNP or nosuid if the
          PATCHEOF
          cat > tools/anykernel.sh <<'AKEOF'
          # AnyKernel3 config for Xiaomi Mi 11 Lite 5G (renoir). Replaces only the kernel
          # Image in the boot partition; the ramdisk and vendor_boot are left untouched.
          # Variable names follow the current osm0sis/AnyKernel3 template (upper case).
          # Does NOT back up the stock boot image: save your own boot.img first.

          properties() { '
          kernel.string=Renoir kernel with SukiSU Ultra + SUSFS + KPM
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=renoir
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev cpio lz4 dwarves zip

      - name: Fetch latest kernel
        uses: actions/checkout@v4
        with:
          repository: Failedmush1/android_kernel_xiaomi_sm8350
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1

      - name: Fetch latest SukiSU-Ultra
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra "$RUNNER_TEMP/sukisu"
          git -C "$RUNNER_TEMP/sukisu" checkout "${{ inputs.sukisu_ref }}"
          echo "SUKISU_COMMIT=$(git -C "$RUNNER_TEMP/sukisu" rev-parse HEAD)" >> "$GITHUB_ENV"
          [ -d "$RUNNER_TEMP/sukisu/kernel/feature" ] && grep -q avc_spoof "$RUNNER_TEMP/sukisu/kernel/feature/avc_spoof.c" \
            || { echo "cabang SukiSU ini tidak punya avc_spoof; pakai builtin-new"; exit 1; }

      - name: Apply SukiSU port
        run: |
          echo "SukiSU ${{ inputs.sukisu_ref }} $SUKISU_COMMIT"
          python3 -I tools/apply_sukisu_port.py kernel "$RUNNER_TEMP/sukisu" "$PWD/tools/ksu-inline-hooks.patch"

      - name: Derive release suffix
        run: |
          U="${{ inputs.uname_r }}"
          if [ -z "$U" ]; then
            V=$(sed -n 's/^VERSION = //p' kernel/Makefile).$(sed -n 's/^PATCHLEVEL = //p' kernel/Makefile).$(sed -n 's/^SUBLEVEL = //p' kernel/Makefile)
            U="$V-qgki-g$(git -C kernel rev-parse HEAD | cut -c1-12)"
            echo "release string otomatis: $U"
          fi
          echo "UNAME_R=$U" >> "$GITHUB_ENV"
          case "$U" in *-qgki*) ;; *) echo "uname_r harus mengandung -qgki"; exit 1;; esac
          echo "LV=${U#*-qgki}" >> "$GITHUB_ENV"

      - name: Configure (same fragments the ROM build uses)
        working-directory: kernel
        run: |
          MK="make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          $MK vendor/lahaina-qgki_defconfig
          CF=arch/arm64/configs/vendor
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m -O out out/.config \
            $CF/debugfs.config $CF/xiaomi_QGKI.config $CF/renoir_QGKI.config
          # LOCALVERSION_AUTO=y selalu menambah git hash; matikan agar release string
          # persis CONFIG_LOCALVERSION ("-qgki") + suffix dari input.
          scripts/config --file out/.config --disable LOCALVERSION_AUTO
          $MK olddefconfig
          grep -E '^(# )?CONFIG_(KSU|KPM|KSU_SUSFS)(_INLINE_HOOK|_PRIORITY_UID_FILTER)?[= ]' out/.config
          grep -q '^CONFIG_KPM=y' out/.config || { echo "KPM tidak aktif"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS_INLINE_HOOK=y' out/.config || { echo "SUSFS inline hook tidak aktif"; exit 1; }
          grep -q '^# CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER is not set' out/.config || { echo "priority uid filter harus mati (SUSFS v2.3.0 tidak punya fungsinya)"; exit 1; }

      - name: Build Image
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="$LV" Image
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel release: $REL"
          [ "$REL" = "$UNAME_R" ] || { echo "release mismatch: $REL vs $UNAME_R"; exit 1; }

      - name: Patch Image with KernelPatch (required for KPM)
        run: |
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch "$RUNNER_TEMP/kp"
          KP="$RUNNER_TEMP/kp"
          echo "KernelPatch $(git -C "$KP" rev-parse --short HEAD)"
          # The kernel's KPM bridge and kpimg must speak the same ABI version.
          A=$(grep -rhoE 'define SUKISU_KPM_ABI_VERSION +[0-9]+' kernel/KernelSU/kernel/extension/kpm/bridge.h | awk '{print $3}')
          B=$(grep -rhoE 'define SUKISU_KPM_ABI_VERSION +[0-9]+' "$KP/kernel/patch/sukisu" | awk '{print $3}' | head -1)
          echo "KPM ABI: kernel=$A kernelpatch=$B"
          [ -n "$A" ] && [ "$A" = "$B" ] || { echo "KPM ABI mismatch"; exit 1; }
          cmake -S "$KP/tools" -B "$KP/tools/build" > /dev/null
          cmake --build "$KP/tools/build" -j"$(nproc)" > /dev/null
          (cd "$KP/kernel" && TARGET_COMPILE=aarch64-linux-gnu- ANDROID=1 \
            make kpimg -j"$(nproc)" CC="aarch64-linux-gnu-gcc -fno-stack-protector -fno-pie" > /dev/null)
          IMG=kernel/out/arch/arm64/boot/Image
          "$KP/tools/build/kptools" -p -i "$IMG" -k "$KP/kernel/kpimg" -s "$(openssl rand -hex 12)" -o "$RUNNER_TEMP/Image.kp" | tail -3
          [ "$(stat -c%s "$RUNNER_TEMP/Image.kp")" -gt "$(stat -c%s "$IMG")" ] || { echo "patched Image not larger"; exit 1; }
          strings -a "$RUNNER_TEMP/Image.kp" | grep -q 'KernelPatch Version' || { echo "kpimg not embedded"; exit 1; }

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 "$RUNNER_TEMP/ak3"
          cp tools/anykernel.sh "$RUNNER_TEMP/ak3/anykernel.sh"
          cp "$RUNNER_TEMP/Image.kp" "$RUNNER_TEMP/ak3/Image"
          cd "$RUNNER_TEMP/ak3"
          rm -rf .git .github README.md
          zip -r9 "$GITHUB_WORKSPACE/renoir-sukisu-ultra-$(date +%Y%m%d).zip" . -x '*.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: renoir-sukisu-ultra
          path: |
            renoir-sukisu-ultra-*.zip
            kernel/out/include/config/kernel.release
