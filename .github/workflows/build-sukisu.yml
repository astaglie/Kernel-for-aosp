name: Build renoir kernel (SukiSU Ultra + SUSFS + KPM)

# Repo kecil ini hanya berisi file ini (skrip port, patch hook dan config AnyKernel3 sudah
# tertanam). Kernel (Failedmush1, cabang KSUNEXT = kernel EvoX A17) dan SukiSU-Ultra
# (cabang builtin-new) diambil TERBARU setiap kali dijalankan.
#
# Diuji lokal (clang 18) pada cabang KSUNEXT: port + patch hook diterapkan, config
# (KPM, SUSFS inline hook) benar, dan driver serta file kernel yang diubah terkompilasi.
# Link penuh diuji pada pohon yang hampir identik (Resuki + file KSUNEXT) dan lolos.
# BELUM diuji: boot di HP, KPM saat runtime, dan workflow ini di GitHub Actions.
#
# builtin-new membawa fitur avc_spoof dan selinux_hide yang diminta manager terbaru
# (cabang builtin lama tidak punya, sehingga muncul "Kernel does not support this feature").
# KPM butuh Image dipatch KernelPatch (langkah "Patch Image with KernelPatch").
#
# Release string: kernel 5.4 dengan CONFIG_MODVERSIONS (aktif di config ini) tidak
# membandingkan release string saat memuat modul (kernel/module.c same_magic), jadi
# tidak perlu cocok persis dengan ROM. Yang dicocokkan: flag vermagic dan CRC simbol,
# yang sama karena sumber dan config sama. Karena itu tidak ada input wajib.

on:
  workflow_dispatch:
    inputs:
      uname_r:
        description: "Opsional, biarkan kosong. Hanya untuk memaksa release string tertentu"
        required: false
        default: ""
      kernel_ref:
        description: "Cabang/commit kernel Failedmush1 (KSUNEXT = EvoX, Resuki = Lineage)"
        default: "KSUNEXT"
      sukisu_ref:
        description: "Cabang/commit SukiSU-Ultra (builtin-new = terbaru untuk kernel lama)"
        default: "builtin-new"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Write helper files (port script + hook patch + AnyKernel3 config)
        run: |
          mkdir -p tools
          cat > tools/apply_sukisu_port.py <<'PYEOF'
          #!/usr/bin/env python3
          """Port the Failedmush1 renoir kernel (KSUNEXT or Resuki branch) to the
          SukiSU-Ultra `builtin-new` driver.

          Usage: python3 -I apply_sukisu_port.py <kernel_tree> <sukisu_checkout> <inline_hooks.patch>

          Every edit asserts that its anchor exists exactly as expected, so a change
          upstream makes this fail loudly instead of silently half-applying.
          """
          import os
          import pathlib
          import shutil
          import subprocess
          import sys


          def sub(path: pathlib.Path, old: str, new: str, count: int = 1) -> None:
              text = path.read_text()
              found = text.count(old)
              if found != count:
                  sys.exit(f"[FAIL] {path}: expected {count} x {old!r}, found {found}")
              path.write_text(text.replace(old, new))
              print(f"[ok] {path}: {old.strip()[:60]!r}")


          def main() -> None:
              tree = pathlib.Path(sys.argv[1]).resolve()
              suki = pathlib.Path(sys.argv[2]).resolve()
              hooks = pathlib.Path(sys.argv[3]).resolve()

              # 1. Driver. Whatever was in drivers/kernelsu (KernelSU-Next on KSUNEXT, a
              #    symlink to ../KernelSU/kernel on Resuki) is replaced by SukiSU, using the
              #    layout drivers/kernelsu -> ../KernelSU/kernel that SukiSU's setup.sh makes.
              link = tree / "drivers/kernelsu"
              if link.is_symlink() or link.is_file():
                  link.unlink()
              elif link.exists():
                  shutil.rmtree(link)
              dst = tree / "KernelSU"
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(suki, dst, ignore=shutil.ignore_patterns(".git"))
              os.symlink("../KernelSU/kernel", link)
              print(f"[ok] drivers/kernelsu -> KernelSU/kernel ({suki.name})")

              # 2. In-kernel hooks. SukiSU with SUSFS uses the inline hooks of the susfs4ksu
              #    patch (exec, open, stat, read, reboot, sys, input, selinux nnp). Resuki
              #    already has them; KSUNEXT hooks through kprobes and does not.
              if "ksu_handle_execveat_sucompat" in (tree / "fs/exec.c").read_text():
                  print("[ok] inline hooks already present, skipping")
              else:
                  for extra in ("-l",):
                      r = subprocess.run(["patch", "-p1", "-N", extra, "-i", str(hooks)],
                                         cwd=tree, capture_output=True, text=True)
                      print(r.stdout)
                      if r.returncode != 0:
                          sys.exit(f"[FAIL] inline hooks patch did not apply:\n{r.stdout}\n{r.stderr}")
                  left = list(tree.rglob("*.rej")) + list(tree.rglob("*.orig"))
                  for f in left:
                      f.unlink()
                  print("[ok] inline hooks applied")

              # 3. SukiSU reports every SELinux type / avtab rule it adds to SUSFS through
              #    these two functions. SUSFS v2.3.0 has no such API and nothing there would
              #    consume the data (its AVC spoofing only reads susfs_ksu_sid /
              #    susfs_priv_app_sid, which the SukiSU driver defines): accept and ignore.
              p = tree / "fs/susfs.c"
              text = p.read_text()
              if "susfs_add_sus_avd_allowed_by_type" in text:
                  print("[ok] susfs.c already provides the SELinux type API, skipping stubs")
              else:
                  p.write_text(text.rstrip("\n") + "\n\n"
                      "/* SukiSU hooks. No consumer in SUSFS v2.3.0, see tools/apply_sukisu_port.py */\n"
                      "int susfs_add_sus_type(const char *secctx, u32 type_value)\n"
                      "{\n\treturn 0;\n}\n\n"
                      "int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u16 type, u32 orig_avd_allowed)\n"
                      "{\n\treturn 0;\n}\n")
                  print(f"[ok] {p}: appended susfs_add_sus_type / susfs_add_sus_avd_allowed_by_type stubs")

              # 4. defconfig: KPM on; drop KernelSU-Next's own hook option (KSUNEXT); the
              #    priority-uid filter calls SUSFS functions that v2.3.0 does not have.
              p = tree / "arch/arm64/configs/vendor/lahaina-qgki_defconfig"
              text = p.read_text()
              text = text.replace("CONFIG_KSU_KPROBES_HOOK=y\n", "")
              p.write_text(text)
              sub(p, "CONFIG_KSU=y\n",
                  "CONFIG_KSU=y\nCONFIG_KPM=y\n# CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER is not set\n")

              print("[done] port applied")


          if __name__ == "__main__":
              main()
          PYEOF
          cat > tools/ksu-inline-hooks.patch <<'PATCHEOF'
          diff -urN a/drivers/input/input.c b/drivers/input/input.c
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -375,10 +375,20 @@
           	return disposition;
           }
           
          +#ifdef CONFIG_KSU
          +extern struct static_key_true ksu_is_input_hook_enabled;
          +extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          +#endif
          +
           static void input_handle_event(struct input_dev *dev,
           			       unsigned int type, unsigned int code, int value)
           {
           	int disposition = input_get_disposition(dev, type, code, &value);
          +#ifdef CONFIG_KSU_SUSFS
          +	if (static_branch_unlikely(&ksu_is_input_hook_enabled))
          +		ksu_handle_input_handle_event(&type, &code, &value);
          +#endif
          +
           
           	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
           		add_input_randomness(type, code, value);
          diff -urN a/fs/exec.c b/fs/exec.c
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -63,6 +63,9 @@
           #include <linux/oom.h>
           #include <linux/compat.h>
           #include <linux/vmalloc.h>
          +#ifdef CONFIG_KSU_SUSFS
          +#include <linux/susfs_def.h>
          +#endif
           
           #include <linux/uaccess.h>
           #include <asm/mmu_context.h>
          @@ -1745,6 +1748,17 @@
